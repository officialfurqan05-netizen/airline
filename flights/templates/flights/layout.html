<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> {% block title %} {% endblock %} </title>
</head>
<body>
{% if user.is_authenticated %}
<p>
    Logged in as:
    <strong>{{ user.username }}</strong>
</p>
<a href="{% url 'users:logout' %}">
    <button>Logout</button>
</a>
{% endif %}
<hr>
{% block body %}

{% endblock %}
</body>
</html>
